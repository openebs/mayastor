#
# {SRCDIR} should point to your working tree which should be your current pwd
#

version: '3'
services:
  ms1:
    container_name: "ms1"
    image: rust:latest
    environment:
        - MY_POD_IP=10.1.0.3
        - NEXUS_NVMF_ANA_ENABLE=1
        - NEXUS_NVMF_RESV_ENABLE=1
        - PATH=${LLVM_SYMBOLIZER_DIR:-}
        - ASAN_OPTIONS=detect_leaks=0
        - ENABLE_INTERRUPT_MODE=${ENABLE_INTERRUPT_MODE:-false}
        - NVME_IOQ_POLL_PERIOD=${NVME_IOQ_POLL_PERIOD:-}
        - RUST_LOG=${RUST_LOG:-info}
    command: ${SRCDIR}/${IO_ENGINE_DIR}/io-engine -g 0.0.0.0 -l ${MS1_CORES:-3,4} -r /tmp/ms1.sock
    networks:
      mayastor_net:
        ipv4_address: 10.1.0.3
    cap_add:
      # NUMA related
      - SYS_ADMIN
      - SYS_NICE
      # uring needs mmap
      - IPC_LOCK
    security_opt:
      # we can set this to a JSON file to allow per syscall access
      - seccomp=unconfined
    volumes:
      - ${SRCDIR}:${SRCDIR}
      - /nix:/nix
      - /dev/hugepages:/dev/hugepages
      - /tmp:/tmp
      - /var/tmp:/var/tmp
  ms2:
    container_name: "ms2"
    image: rust:latest
    environment:
        - MY_POD_IP=10.1.0.4
        - NEXUS_NVMF_ANA_ENABLE=1
        - NEXUS_NVMF_RESV_ENABLE=1
        - PATH=${LLVM_SYMBOLIZER_DIR:-}
        - ASAN_OPTIONS=detect_leaks=0
        - ENABLE_INTERRUPT_MODE=${ENABLE_INTERRUPT_MODE:-false}
        - NVME_IOQ_POLL_PERIOD=${NVME_IOQ_POLL_PERIOD:-}
        - RUST_LOG=${RUST_LOG:-info}
    command: ${SRCDIR}/${IO_ENGINE_DIR}/io-engine -g 0.0.0.0 -l ${MS2_CORES:-5,6} -r /tmp/ms2.sock
    networks:
      mayastor_net:
        ipv4_address: 10.1.0.4
    cap_add:
      # NUMA related
      - SYS_ADMIN
      - SYS_NICE
      # uring needs mmap
      - IPC_LOCK
    security_opt:
      # we can set this to a JSON file to allow per syscall access
      - seccomp=unconfined
    volumes:
      - ${SRCDIR}:${SRCDIR}
      - /nix:/nix
      - /dev/hugepages:/dev/hugepages
      - /tmp:/tmp
      - /var/tmp:/var/tmp
  ms3:
    container_name: "ms3"
    image: rust:latest
    environment:
        - MY_POD_IP=10.1.0.5
        - NVME_KATO_MS=1000
        - NEXUS_NVMF_ANA_ENABLE=1
        - NEXUS_NVMF_RESV_ENABLE=1
        - PATH=${LLVM_SYMBOLIZER_DIR:-}
        - ASAN_OPTIONS=detect_leaks=0
        - ENABLE_INTERRUPT_MODE=${ENABLE_INTERRUPT_MODE:-false}
        - NVME_IOQ_POLL_PERIOD=${NVME_IOQ_POLL_PERIOD:-}
        - RUST_LOG=${RUST_LOG:-info}
    command: ${SRCDIR}/${IO_ENGINE_DIR}/io-engine -g 0.0.0.0 -l ${MS3_CORES:-0,7} -r /tmp/ms3.sock
    networks:
      mayastor_net:
        ipv4_address: 10.1.0.5
    cap_add:
      # NUMA related
      - SYS_ADMIN
      - SYS_NICE
      # uring needs mmap
      - IPC_LOCK
    security_opt:
      # we can set this to a JSON file to allow per syscall access
      - seccomp=unconfined
    volumes:
      - ${SRCDIR}:${SRCDIR}
      - /nix:/nix
      - /dev/hugepages:/dev/hugepages
      - /tmp:/tmp
      - /var/tmp:/var/tmp
networks:
  mayastor_net:
    name: mayastor_net
    ipam:
      driver: default
      config:
        - subnet: "10.1.0.0/16"
