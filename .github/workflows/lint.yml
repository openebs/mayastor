name: Linter CI
on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CI: 1

jobs:
  code-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Setup Nix Environment
        uses: ./utils/dependencies/.github/actions/setup-nix
        with:
          nix-sources: spdk-rs/nix/sources.json
          pre-fetch-nix: ./shell.nix
          github-access-token: ${{ secrets.GITHUB_TOKEN }}
          rust-cache: true
      - name: Lint rust code
        run: |
          nix-shell --run "FMT_OPTS=--check ./scripts/rust-style.sh"
          nix-shell --run "./scripts/rust-linter.sh"
      - name: Lint JS code
        run: nix-shell --run "./scripts/js-check.sh"
      - name: Lint python code
        run: nix-shell --run "black --diff --check test/python"
      - name: Lint Nix code
        run: nix-shell --run "nixpkgs-fmt --check ."
