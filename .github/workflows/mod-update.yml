name: Submodule Update
on:
  workflow_dispatch:
    inputs:
      submodules:
        description: 'Override modules to update via comma-separated list of names'
        required: false
        default: ''

jobs:
  submodule:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Update submodules
        run: ./utils/dependencies/scripts/git/submodule-branches.sh -u -m "${{ github.event.inputs.submodules }}"

      # Submodule crates are path dependencies, so their Cargo.toml changes may need Cargo.lock updates
      - name: Setup Nix
        uses: ./utils/dependencies/.github/actions/setup-nix
        with:
          nix-sources: spdk-rs/nix/sources.json
          github-access-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Cargo.lock
        run: nix-shell nix/shells/rust.nix --run "cargo metadata --format-version 1 >/dev/null"

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(ci): update git submodules"
          committer: GitHub <noreply@github.com>
          title: "[CI] Update git submodules"
          draft: false
          signoff: true
          delete-branch: true
          branch: update-submodules/${{ github.ref_name }}
          token: ${{ secrets.CI_BOT_1_RAISE_PRS }}

      - name: Approve Pull Request by CI Bot 1
        if: ${{ steps.cpr.outputs.pull-request-operation == 'created' }}
        run: |
          gh pr review ${{ steps.cpr.outputs.pull-request-number }} --approve
        env:
          GH_TOKEN: ${{ github.token }}
