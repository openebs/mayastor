name: Image Push
on:
  push:
    branches:
      - develop
      - 'release/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to be released (e.g. v2.10.0)'
        required: false
        type: string
      registry:
        description: 'Registry host (no slash), example: ghcr.io'
        required: false
        type: string
      owner:
        description: 'Repository owner (defaults to github.repository_owner if empty)'
        required: false
        type: string
      namespace:
        description: 'Namespace, example: mayastor/dev'
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Tag to be released (e.g. v2.10.0)'
        required: true
        type: string
      registry:
        description: 'Registry host (no slash), example: ghcr.io'
        required: true
        type: string
      owner:
        description: 'Repository owner (defaults to github.repository_owner if empty)'
        required: false
        type: string
      namespace:
        description: 'Namespace, example: mayastor/dev'
        required: true
        type: string
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CI: 1
  TAG: ${{ inputs.tag }}

jobs:
  vars:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.registry.outputs.registry }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Compose the registry
        id: registry
        uses: ./utils/dependencies/.github/actions/registry-compose
        with:
          registry: ${{ inputs.registry }}
          owner: ${{ inputs.owner || github.repository_owner }}
          namespace: ${{ inputs.namespace }}

  image-build:
    needs: vars
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - name: Build the release images
        uses: ./utils/dependencies/.github/actions/image-build
        with:
          tag: ${{ env.TAG }}
          registry: ${{ needs.vars.outputs.registry }}

  manifest-push:
    needs: [vars, image-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - name: Assemble and push the multi-arch images
        uses: ./utils/dependencies/.github/actions/image-manifest-push
        with:
          tag: ${{ env.TAG }}
          registry: ${{ needs.vars.outputs.registry }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
