name: ImageBuild CI
on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CI: 1

jobs:
  image-build-test:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Setup Nix Environment
        uses: ./utils/dependencies/.github/actions/setup-nix
        with:
          nix-sources: spdk-rs/nix/sources.json
          github-access-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test building the release images
        # SBOMs are generated here too so a break in the SBOM path is caught
        # pre-merge rather than on the develop push. Nothing is signed, since
        # nothing is published.
        run: ./scripts/release.sh --skip-publish --build-bins --sbom
