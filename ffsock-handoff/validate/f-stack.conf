# F-Stack config for the ff+spdk spike, net_tap backend.
# The --vdev=net_tap0 / --no-pci / -m EAL args are injected via FF_EAL_EXTRA
# (see the SPIKE PATCH in ff_config.c) so we never touch a real NIC.
[dpdk]
# core 3 (bit 3 = 0x8): io-engine typically holds 0-2. Single lcore for the spike.
lcore_mask=8
channel=1
promiscuous=1
numa_on=0
tso=0
vlan_strip=0
idle_sleep=1
port_list=0
nb_vdev=0
nb_bond=0

[pcap]
enable=0

# port0 = the net_tap device. Peers with the kernel side (fftap0 = 10.99.0.1).
[port0]
addr=10.99.0.2
netmask=255.255.255.0
broadcast=10.99.0.255
gateway=10.99.0.1

[freebsd.boot]
hz=100
fd_reserve=1024
kern.ipc.maxsockets=262144
net.inet.tcp.syncache.hashsize=4096
net.inet.tcp.syncache.bucketlimit=100
net.inet.tcp.tcbhashsize=65536
kern.ncallout=262144
kern.features.inet6=1

[freebsd.sysctl]
kern.ipc.somaxconn=32768
kern.ipc.maxsockbuf=16777216
net.inet.tcp.sendspace=16384
net.inet.tcp.recvspace=8192
net.inet.tcp.sendbuf_max=16777216
net.inet.tcp.recvbuf_max=16777216
net.inet.tcp.sendbuf_auto=1
net.inet.tcp.recvbuf_auto=1
net.inet.tcp.sack.enable=1
net.inet.tcp.msl=2000
net.inet.tcp.delayed_ack=1
net.inet.tcp.rfc1323=1
