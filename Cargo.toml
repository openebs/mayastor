[profile.dev]
panic = "abort"

[workspace]
resolver = "1"
members = [
    "jsonrpc",
    "libnvme-rs",
    "io-engine",
    "io-engine-bench",
    "io-engine-tests",
    "sysfs",
    "spdk-rs",
    "utils/dependencies/apis/io-engine",
    "utils/dependencies/prost-extend",
    "utils/dependencies/version-info",
    "utils/dependencies/composer",
    "utils/dependencies/devinfo",
    "utils/dependencies/nvmeadm",
]

[workspace.dependencies]
prost-extend = { path = "./utils/dependencies/prost-extend" }

tokio = "1.45.1"
futures = "0.3.31"

tracing = "0.1.40"
tracing-core = "0.1.32"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

once_cell = "1.20.2"
async-trait = "0.1.83"
crossbeam = "0.8.4"
ioctl-gen = "0.1.1"
libc = "0.2.161"
parking_lot = "0.12.3"

serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
serde_yaml = "0.9.34"

snafu = "0.8.5"
url = "2.5.4"
uuid = { version = "1.4.1", features = ["v4"] }
chrono = "0.4.38"
glob = "0.3.1"
md5 = "0.7.0"
rand = "0.8.6"
rand_chacha = "0.3.1"
colored_json = "5.0.0"

strum = "0.26.3"
strum_macros = "0.26.4"
hex = "0.4.3"

tonic = "0.12.3"
tonic-build = "0.12.3"
prost-types = "0.13.3"
prost = "0.13.2"
prost-derive = "0.13.3"
bytes = "1.11.1"
prost-build = "0.13.3"

udev = "0.9.1"
bindgen = "0.70.1"
cc = "1.1.31"
nix = { version = "0.29.0", default-features = false }
ipnetwork = "0.20.0"
bollard = "0.17.1"
semver = "1.0.23"
run_script = "0.11.0"
derive_builder = "0.20.2"
regex = "1.11.1"

async-nats = { version = "0.47.0", default-features = false, features = ["jetstream"] }
